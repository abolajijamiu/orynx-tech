[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orynx-bookleads"
version = "0.1.0"
description = "Extract book and author leads from publisher, retailer, review and bibliographic platforms."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "rapidfuzz>=3.9",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "openpyxl>=3.1",
    "PyYAML>=6.0",
    "tenacity>=8.3",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.5"]

[project.scripts]
orynx = "orynx.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orynx = ["recipes/*.yaml", "platforms/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
